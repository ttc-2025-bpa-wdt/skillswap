name: "skillswap-dev"
services:
  postgres:
    image: postgres:17-alpine
    env_file: .env.dev
    volumes:
      - postgres-data:/var/lib/postgresql/data:rw
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: ../project/shared/docker
      dockerfile: Dockerfile.migrate
    volumes:
      - ../project/shared:/shared:rw
      - shared-node_modules:/shared/node_modules:rw
      - shared-gen:/shared/gen:rw
    env_file: .env.dev
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ../project/backend/docker
      dockerfile: Dockerfile.dev
    volumes:
      - ../project/backend:/app:rw
      - ../project/shared:/shared:rw
      - backend-node_modules:/app/node_modules:rw
      - shared-node_modules:/shared/node_modules:rw
      - shared-gen:/shared/gen:rw
    env_file: .env.dev
    environment:
      NODE_ENV: development
      PORT: "3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ../project/frontend/docker
      dockerfile: Dockerfile.dev
    volumes:
      - ../project/frontend:/app:rw
      - ../project/shared:/shared:rw
      - frontend-node_modules:/app/node_modules:rw
      - frontend-astro-cache:/app/.astro:rw
      - shared-node_modules:/shared/node_modules:rw
      - shared-gen:/shared/gen:rw
    env_file: .env.dev
    environment:
      BACKEND_URL: "http://backend:3001"
      ASTRO_TELEMETRY_DISABLED: "1"
      NODE_ENV: development
      PORT: "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "${HOST_PORT:-3000}:80"
    volumes:
      - ../project/edge/hosts/dev.conf:/etc/nginx/conf.d/hosts/dev.conf:ro
      - ../project/edge/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  shared-node_modules:
  shared-gen:
  frontend-node_modules:
  frontend-astro-cache:
  backend-node_modules:
