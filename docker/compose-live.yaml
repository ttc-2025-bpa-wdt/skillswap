name: "skillswap"
services:
  postgres:
    image: postgres:17-alpine
    env_file: .env.prod
    volumes:
      - postgres-data:/var/lib/postgresql/data:rw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: ../project/shared/docker
      dockerfile: Dockerfile.migrate
    volumes:
      - ../project/shared:/shared:rw
    env_file: .env.prod
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ../project
      dockerfile: ./backend/docker/Dockerfile
    env_file: .env.prod
    environment:
      NODE_ENV: production
      PORT: "3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ../project
      dockerfile: ./frontend/docker/Dockerfile
      args:
        # Dummy values for build-time only (real values used at runtime via env_file)
        DATABASE_URL: postgresql://build:build@localhost:5432/build
        JWT_SECRET: build-time-placeholder
        PASSWORD_PEPPER: build-time-placeholder
        REGISTRATION_KEY: build-time-placeholder
        NODE_ENV: production
    env_file: .env.prod
    environment:
      NODE_ENV: production
      PORT: "3000"
      BACKEND_URL: "http://backend:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    environment:
      HOST: ${HOST:-skillswap.internal}
    volumes:
      - ../project/edge/hosts/live.conf:/etc/nginx/templates/live.conf.template:ro
      - ../project/edge/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${HOST_PORT:-80}:80"
    command: ["/bin/sh", "-c", "mkdir -p /etc/nginx/conf.d/hosts && envsubst '$$HOST' < /etc/nginx/templates/live.conf.template > /etc/nginx/conf.d/hosts/live.conf && nginx -g 'daemon off;'"]
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
